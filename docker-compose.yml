# Production-style deployment: PostgreSQL + API + web (nginx).
#   cp .env.example .env   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose pull && docker compose up -d   # use the published images
#   docker compose up -d --build                  # or build from source
# The site and the API are served together on WEB_PORT (API under /api).
name: taskplus

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskplus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskplus -d taskplus"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: atharvdeshmukh014/task-plus:api
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://taskplus:${POSTGRES_PASSWORD}@db:5432/taskplus
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: atharvdeshmukh014/task-plus:web
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
